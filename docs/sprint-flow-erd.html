<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprint Flow — ERD</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f1e; overflow: hidden; }
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const TABLES = {
      users: {
        color: "#3b82f6", icon: "👤", x: 60, y: 200,
        fields: [
          { name: "id", type: "string", pk: true },
          { name: "name", type: "string" },
          { name: "email", type: "string" },
          { name: "image", type: "string" },
          { name: "password_hash", type: "string" },
          { name: "role", type: "string" },
        ]
      },
      accounts: {
        color: "#6b7280", icon: "🔑", x: 400, y: 60,
        fields: [
          { name: "id", type: "string", pk: true },
          { name: "user_id", type: "string", fk: true },
          { name: "provider", type: "string" },
          { name: "provider_account_id", type: "string" },
        ]
      },
      projects: {
        color: "#8b5cf6", icon: "📁", x: 400, y: 310,
        fields: [
          { name: "id", type: "string", pk: true },
          { name: "name", type: "string" },
          { name: "key", type: "string" },
          { name: "owner_id", type: "string", fk: true },
          { name: "created_at", type: "timestamp" },
        ]
      },
      sprints: {
        color: "#eab308", icon: "⚡", x: 720, y: 200,
        fields: [
          { name: "id", type: "string", pk: true },
          { name: "project_id", type: "string", fk: true },
          { name: "name", type: "string" },
          { name: "start_date", type: "date" },
          { name: "end_date", type: "date" },
          { name: "status", type: "string" },
        ]
      },
      tasks: {
        color: "#22c55e", icon: "✅", x: 1020, y: 280,
        fields: [
          { name: "id", type: "string", pk: true },
          { name: "sprint_id", type: "string", fk: true },
          { name: "assignee_id", type: "string", fk: true },
          { name: "title", type: "string" },
          { name: "status", type: "string" },
          { name: "priority", type: "string" },
        ]
      },
      attachments: {
        color: "#f97316", icon: "📎", x: 1340, y: 120,
        fields: [
          { name: "id", type: "string", pk: true },
          { name: "task_id", type: "string", fk: true },
          { name: "file_name", type: "string" },
          { name: "file_data", type: "blob" },
          { name: "mime_type", type: "string" },
        ]
      },
      comments: {
        color: "#eab308", icon: "💬", x: 1340, y: 390,
        fields: [
          { name: "id", type: "string", pk: true },
          { name: "task_id", type: "string", fk: true },
          { name: "user_id", type: "string", fk: true },
          { name: "content", type: "string" },
          { name: "created_at", type: "timestamp" },
        ]
      },
      notifications: {
        color: "#ef4444", icon: "🔔", x: 60, y: 540,
        fields: [
          { name: "id", type: "string", pk: true },
          { name: "user_id", type: "string", fk: true },
          { name: "message", type: "string" },
          { name: "is_read", type: "boolean" },
          { name: "type", type: "string" },
        ]
      },
    };

    const TABLE_W = 220;
    const FIELD_H = 28;
    const HEADER_H = 40;

    function getFieldY(table, fieldName) {
      const idx = table.fields.findIndex(f => f.name === fieldName);
      return table.y + HEADER_H + idx * FIELD_H + FIELD_H / 2 + 6;
    }

    const RELATIONS = [
      ["users", "id", "accounts", "user_id"],
      ["users", "id", "projects", "owner_id"],
      ["users", "id", "notifications", "user_id"],
      ["users", "id", "comments", "user_id"],
      ["users", "id", "tasks", "assignee_id"],
      ["projects", "id", "sprints", "project_id"],
      ["sprints", "id", "tasks", "sprint_id"],
      ["tasks", "id", "attachments", "task_id"],
      ["tasks", "id", "comments", "task_id"],
    ];

    function EdgeLine({ from, to, tables, highlighted }) {
      const ft = tables[from[0]];
      const tt = tables[to[0]];

      let x1, y1, x2, y2;
      if (ft.x <= tt.x) {
        x1 = ft.x + TABLE_W; y1 = getFieldY(ft, from[1]);
        x2 = tt.x;           y2 = getFieldY(tt, to[1]);
      } else {
        x1 = ft.x;           y1 = getFieldY(ft, from[1]);
        x2 = tt.x + TABLE_W; y2 = getFieldY(tt, to[1]);
      }

      const dx = Math.abs(x2 - x1) * 0.5;
      const path = `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;

      return (
        <path
          d={path}
          fill="none"
          stroke={highlighted ? "#94a3b8" : "#1e293b"}
          strokeWidth={highlighted ? 2 : 1.5}
          strokeDasharray={highlighted ? "none" : "4,3"}
          opacity={highlighted ? 1 : 0.8}
          markerEnd={highlighted ? "url(#arrowHighlight)" : "url(#arrow)"}
        />
      );
    }

    function ERD() {
      const [tables, setTables] = useState(TABLES);
      const [dragging, setDragging] = useState(null);
      const [selected, setSelected] = useState(null);
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const [pan, setPan] = useState({ x: 20, y: 50 });
      const [panStart, setPanStart] = useState(null);
      const [zoom, setZoom] = useState(0.72);

      const onTableMouseDown = (e, key) => {
        e.stopPropagation();
        setSelected(key);
        setDragging(key);
        setOffset({
          x: e.clientX - tables[key].x * zoom - pan.x,
          y: e.clientY - tables[key].y * zoom - pan.y
        });
      };

      const onBgMouseDown = (e) => {
        setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
        setSelected(null);
      };

      const onMouseMove = (e) => {
        if (dragging) {
          setTables(prev => ({
            ...prev,
            [dragging]: {
              ...prev[dragging],
              x: (e.clientX - offset.x - pan.x) / zoom,
              y: (e.clientY - offset.y - pan.y) / zoom,
            }
          }));
        } else if (panStart) {
          setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
        }
      };

      const onMouseUp = () => { setDragging(null); setPanStart(null); };

      const onWheel = (e) => {
        e.preventDefault();
        setZoom(z => Math.min(1.6, Math.max(0.25, z - e.deltaY * 0.001)));
      };

      const highlightedEdges = selected
        ? new Set(RELATIONS.filter(r => r[0] === selected || r[2] === selected).map(r => r.join(">")))
        : new Set();

      return (
        <div
          onMouseMove={onMouseMove}
          onMouseUp={onMouseUp}
          onMouseDown={onBgMouseDown}
          onWheel={onWheel}
          style={{
            width: "100vw", height: "100vh", overflow: "hidden",
            background: "#0a0f1e",
            cursor: panStart ? "grabbing" : "default",
            fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
            userSelect: "none",
            position: "relative",
          }}
        >
          {/* Header */}
          <div style={{
            position: "fixed", top: 0, left: 0, right: 0, zIndex: 20,
            background: "rgba(10,15,30,0.97)",
            borderBottom: "1px solid #1e293b",
            padding: "10px 24px",
            display: "flex", alignItems: "center", gap: 16,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#3b82f6", boxShadow: "0 0 8px #3b82f6" }} />
              <span style={{ color: "#e2e8f0", fontSize: 14, fontWeight: 700, letterSpacing: 2 }}>SPRINT FLOW</span>
              <span style={{ color: "#334155", fontSize: 11 }}>/ ERD</span>
            </div>
            <div style={{ marginLeft: "auto", display: "flex", gap: 16, alignItems: "center" }}>
              <span style={{ color: "#334155", fontSize: 11 }}>
                {Object.keys(tables).length} tables · {RELATIONS.length} relations
              </span>
              {[["PK", "#f59e0b"], ["FK", "#8b5cf6"], ["field", "#475569"]].map(([label, color]) => (
                <span key={label} style={{
                  fontSize: 10, color,
                  border: `1px solid ${color}50`,
                  padding: "2px 7px", borderRadius: 4,
                }}>{label}</span>
              ))}
              <span style={{ color: "#334155", fontSize: 11 }}>{Math.round(zoom * 100)}%</span>
            </div>
          </div>

          {/* SVG edges */}
          <svg style={{
            position: "absolute", inset: 0, width: "100%", height: "100%",
            pointerEvents: "none", zIndex: 1,
          }}>
            <defs>
              <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
                <path d="M0,0 L0,7 L7,3.5 z" fill="#1e293b" />
              </marker>
              <marker id="arrowHighlight" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
                <path d="M0,0 L0,7 L7,3.5 z" fill="#94a3b8" />
              </marker>
            </defs>
            <g transform={`translate(${pan.x},${pan.y}) scale(${zoom})`}>
              {RELATIONS.map((r, i) => {
                const key = r.join(">");
                return (
                  <EdgeLine
                    key={i}
                    from={[r[0], r[1]]}
                    to={[r[2], r[3]]}
                    tables={tables}
                    highlighted={highlightedEdges.has(key)}
                  />
                );
              })}
            </g>
          </svg>

          {/* Tables */}
          <div style={{
            position: "absolute", top: 0, left: 0,
            transformOrigin: "0 0",
            transform: `translate(${pan.x}px,${pan.y}px) scale(${zoom})`,
            zIndex: 2,
          }}>
            {Object.entries(tables).map(([key, table]) => {
              const isSel = selected === key;
              return (
                <div
                  key={key}
                  onMouseDown={e => onTableMouseDown(e, key)}
                  style={{
                    position: "absolute",
                    left: table.x, top: table.y,
                    width: TABLE_W,
                    borderRadius: 10,
                    border: `1.5px solid ${isSel ? table.color : "#1e293b"}`,
                    boxShadow: isSel
                      ? `0 0 28px ${table.color}50, 0 8px 32px rgba(0,0,0,0.7)`
                      : "0 4px 20px rgba(0,0,0,0.5)",
                    background: "#0f172a",
                    overflow: "hidden",
                    cursor: "grab",
                    transition: "border-color 0.15s, box-shadow 0.15s",
                    zIndex: isSel ? 10 : 1,
                  }}
                >
                  {/* Table header */}
                  <div style={{
                    height: HEADER_H,
                    background: `linear-gradient(135deg, ${table.color}25, ${table.color}10)`,
                    borderBottom: `1px solid ${table.color}35`,
                    padding: "0 12px",
                    display: "flex", alignItems: "center", gap: 8,
                  }}>
                    <span style={{ fontSize: 15 }}>{table.icon}</span>
                    <span style={{
                      color: table.color, fontWeight: 700,
                      fontSize: 12, letterSpacing: 1.5,
                      textTransform: "uppercase",
                    }}>{key}</span>
                  </div>
                  {/* Fields */}
                  <div style={{ padding: "6px 0" }}>
                    {table.fields.map((f, fi) => (
                      <div key={f.name} style={{
                        display: "flex", alignItems: "center",
                        height: FIELD_H, padding: "0 12px", gap: 8,
                        borderBottom: fi < table.fields.length - 1 ? "1px solid #0d1526" : "none",
                      }}>
                        {f.pk && (
                          <span style={{
                            fontSize: 9, color: "#f59e0b",
                            border: "1px solid #f59e0b55",
                            padding: "1px 4px", borderRadius: 3,
                            minWidth: 22, textAlign: "center",
                          }}>PK</span>
                        )}
                        {f.fk && (
                          <span style={{
                            fontSize: 9, color: "#8b5cf6",
                            border: "1px solid #8b5cf655",
                            padding: "1px 4px", borderRadius: 3,
                            minWidth: 22, textAlign: "center",
                          }}>FK</span>
                        )}
                        {!f.pk && !f.fk && <span style={{ minWidth: 22 }} />}
                        <span style={{
                          flex: 1, fontSize: 12,
                          color: f.pk ? "#f1f5f9" : f.fk ? "#c4b5fd" : "#94a3b8",
                        }}>{f.name}</span>
                        <span style={{ fontSize: 10, color: "#334155" }}>{f.type}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Footer hint */}
          <div style={{
            position: "fixed", bottom: 14, left: "50%",
            transform: "translateX(-50%)",
            color: "#1e293b", fontSize: 10, letterSpacing: 1.5,
            pointerEvents: "none",
          }}>
            DRAG TABLES · SCROLL TO ZOOM · CLICK TO HIGHLIGHT RELATIONS
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ERD />);
  </script>
</body>
</html>
